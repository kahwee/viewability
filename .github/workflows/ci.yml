name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source, package, and consumers
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Pack release candidate
        run: mkdir artifacts && npm pack --ignore-scripts --pack-destination artifacts
      - name: Upload package and browser builds
        uses: actions/upload-artifact@v7
        with:
          name: package-build
          path: |
            artifacts/*.tgz
            dist
          if-no-files-found: error
          retention-days: 7

  node-compatibility:
    name: Node.js ${{ matrix.node-version }} consumers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test consumers
        run: npm run build && npm run test:consumers

  browser:
    name: Playwright ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download shared build
        uses: actions/download-artifact@v8
        with:
          name: package-build
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser system dependencies
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install browser binary
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ matrix.browser }}
      - name: Run browser tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
