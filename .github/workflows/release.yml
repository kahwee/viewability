name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record checked source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test immutable release asset recovery
        run: python3 scripts/test_release_assets.py -v

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
      - name: Validate tag and package version
        run: node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci
      # Source checks and audit are independent of the package build.
      - parallel:
          - name: Check code style
            run: npm run check:biome
          - name: Type check
            run: npm run typecheck
          - name: Tests with coverage
            run: npm run test:coverage
          - name: Audit production dependencies
            run: npm audit --omit=dev
      - name: Build and verify package and consumers
        run: npm run build && npm run lint:package && npm run test:package && npm run test:consumers
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-all-${{ hashFiles('package-lock.json') }}
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium firefox webkit
      - name: Install browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit
      - name: Run all browser tests
        run: npx playwright test
      - name: Assemble release artifacts
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cp dist/viewability.min.js release/
          sha256sum release/* > release/SHA256SUMS
      - name: Upload checked release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish checked GitHub artifacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the reviewed, standard-library uploader runs with write authority.
      # Do not install dependencies or run build/test/package hooks in this job.
      - name: Check out release uploader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: scripts/release-assets.py
          sparse-checkout-cone-mode: false
      - name: Download checked artifacts from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: release
      - name: Verify artifact checksums
        run: sha256sum --check release/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-assets.py "$GITHUB_REF_NAME" release --generate-notes --title "viewability $GITHUB_REF_NAME"
