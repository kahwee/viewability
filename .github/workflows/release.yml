name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Validate tag and package version
        run: node scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci
      # Source checks and audit are independent of the package build.
      - parallel:
          - name: Check code style
            run: npm run check:biome
          - name: Type check
            run: npm run typecheck
          - name: Tests with coverage
            run: npm run test:coverage
          - name: Audit production dependencies
            run: npm audit --omit=dev
      - name: Build and verify package and consumers
        run: npm run build && npm run lint:package && npm run test:package && npm run test:consumers
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-all-${{ hashFiles('package-lock.json') }}
      - name: Install browser system dependencies
        run: npx playwright install-deps chromium firefox webkit
      - name: Install browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit
      - name: Run all browser tests
        run: npx playwright test
      - name: Assemble release artifacts
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cp dist/viewability.min.js release/
          sha256sum release/* > release/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "viewability $GITHUB_REF_NAME"
          fi
